ConnectMe is a mobile application concept designed to assist children with Autism Spectrum Disorder (ASD) in developing two-way communication skills through visual interaction.

To address this challenge, ConnectMe adopts the concept of Augmentative and Alternative Communication (AAC), specifically the Picture Exchange Communication System (PECS). PECS enables children with autism to communicate by selecting visual symbols or pictures that represent objects, actions, or needs.

Traditional PECS tools usually rely on physical picture boards or books. However, these tools often have limitations such as restricted vocabulary options and lack of interactive learning elements. ConnectMe transforms this traditional approach into a digital and interactive experience through a mobile application.

The application allows children to select visual cards that trigger audio feedback, helping them associate images with spoken words and gradually build their vocabulary. The design emphasizes simple navigation, large visual elements, and minimal text to ensure accessibility for children with sensory and cognitive differences.

The project was developed using a User-Centered Design (UCD) approach, focusing on understanding user needs through research, defining user personas, designing wireframes, and creating interactive prototypes.

ConnectMe aims to become a Minimum Viable Product (MVP) that helps children with autism communicate more effectively while supporting caregivers in understanding their needs. The project also contributes to the Sustainable Development Goal (SDG) 10: Reduced Inequalities by promoting inclusive communication technologies.

    const image = document.createElement("img");
    image.src = media.src;
    image.className = "img-fluid";
    image.alt = project.title;

    slide.appendChild(image);

  } else if (media.type === "video") {

    const video = document.createElement("video");
    video.src = media.src;
    video.controls = true;
    video.className = "img-fluid";

    slide.appendChild(video);

  } else if (media.type === "youtube") {

    const iframe = document.createElement("iframe");
    iframe.src = media.src;
    iframe.width = "100%";
    iframe.height = "400";
    iframe.frameBorder = "0";
    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen = true;

    slide.appendChild(iframe);
  }

  imagesContainer.appendChild(slide);
});
  const swiper = new Swiper(".mySwiper", {
    loop: true,
    speed: 600,
    autoplay: {
      delay: 3000,
      disableOnInteraction: false
    },
    pagination: {
      el: ".swiper-pagination",
      clickable: true
    },

    on: {
      slideChange: function () {

        const activeSlide = this.slides[this.activeIndex];

        const youtube = activeSlide.querySelector("iframe");

        if (youtube) {
          this.autoplay.stop();
        } else {
          this.autoplay.start();
        }

      }
    }
  });

  // HANDLE VIDEO
  document.querySelectorAll("video").forEach(video => {

    video.addEventListener("play", () => {
      swiper.autoplay.stop();
    });

    video.addEventListener("ended", () => {
      swiper.slideNext();
      swiper.autoplay.start();
    });

  });

} else {

  document.getElementById("project-title").innerText = "Project Not Found";

}

</script>
